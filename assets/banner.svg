<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 46px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 13px; fill: #38bdf8; }
    .card-title { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 15px; fill: #f8fafc; }
    .card-sub { font-family: system-ui, -apple-system, sans-serif; font-weight: 400; font-size: 12px; fill: #94a3b8; }
    
    /* Dynamic Animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.05); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }

    .pulse-bg { animation: pulseGlow 6s ease-in-out infinite; transform-origin: center; }
    .float-1 { animation: floatParticle 4s ease-in-out infinite; }
    .float-2 { animation: floatParticle 5s ease-in-out infinite 1s; }
    .float-3 { animation: floatParticle 4.5s ease-in-out infinite 0.5s; }
  </style>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16" />

  <!-- Animated Glowing Background Orbs (Behind everything) -->
  <circle cx="200" cy="100" r="180" fill="#6366f1" opacity="0.25" filter="url(#glow)" class="pulse-bg" />
  <circle cx="1000" cy="300" r="220" fill="#a855f7" opacity="0.2" filter="url(#glow)" class="pulse-bg" />

  <!-- Grid Pattern (Subtle) -->
  <g opacity="0.05">
    <path d="M 0,50 H 1200 M 0,100 H 1200 M 0,150 H 1200 M 0,200 H 1200 M 0,250 H 1200 M 0,300 H 1200 M 0,350 H 1200" stroke="#ffffff" stroke-width="1" />
    <path d="M 100,0 V 400 M 200,0 V 400 M 300,0 V 400 M 400,0 V 400 M 500,0 V 400 M 600,0 V 400 M 700,0 V 400 M 800,0 V 400 M 900,0 V 400 M 1000,0 V 400 M 1100,0 V 400" stroke="#ffffff" stroke-width="1" />
  </g>

  <!-- Dynamic Architectural Illustration (Right side, lower layer so text remains 100% visible) -->
  <g transform="translate(720, 60)">
    <!-- Connection Lines -->
    <path d="M 80,80 L 220,50 M 80,180 L 220,120 M 80,180 L 220,240 M 220,120 L 340,180" stroke="#475569" stroke-width="2" stroke-dasharray="4 4" />
    <path d="M 80,80 L 220,120" stroke="url(#cyanGrad)" stroke-width="2" filter="url(#subtleGlow)" />

    <!-- Node 1: EHR Source -->
    <g class="float-1" transform="translate(20, 50)">
      <rect width="120" height="60" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#subtleGlow)" />
      <text x="15" y="26" class="card-title">EHR / HL7v2</text>
      <text x="15" y="44" class="card-sub">Clinical Feed</text>
    </g>

    <!-- Node 2: DICOM Store -->
    <g class="float-2" transform="translate(20, 150)">
      <rect width="120" height="60" rx="10" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.5" />
      <text x="15" y="26" class="card-title">DICOM Imaging</text>
      <text x="15" y="44" class="card-sub">PACS / PACS-Web</text>
    </g>

    <!-- Node 3: FHIR Engine (Center) -->
    <g class="float-3" transform="translate(170, 90)">
      <rect width="140" height="80" rx="12" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="2" filter="url(#glow)" />
      <text x="15" y="30" class="card-title" fill="#a855f7">FHIR R4/R5</text>
      <text x="15" y="50" class="card-sub">HAPI / Medplum Store</text>
      <text x="15" y="66" class="badge-text" font-size="10">De-identified PHI</text>
    </g>

    <!-- Node 4: Data Lake (Output) -->
    <g class="float-1" transform="translate(320, 140)">
      <rect width="130" height="70" rx="10" fill="url(#cardGrad)" stroke="#f472b6" stroke-width="1.5" />
      <text x="15" y="28" class="card-title">Data Lake</text>
      <text x="15" y="46" class="card-sub">AWS / GCP / Delta</text>
      <text x="15" y="60" class="badge-text" fill="#f472b6" font-size="10">Analytics & AI</text>
    </g>
  </g>

  <!-- Left Side: Main Header (Guaranteed foreground placement) -->
  <g transform="translate(60, 0)">
    <!-- Top Pill Badge -->
    <g transform="translate(0, 75)">
      <rect width="270" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
      <circle cx="16" cy="16" r="5" fill="#22c55e" />
      <text x="30" y="21" class="badge-text">HEALTHCARE DATA INFRASTRUCTURE</text>
    </g>

    <!-- Title -->
    <text x="0" y="165" class="title">
      Awesome Healthcare
    </text>
    <text x="0" y="220" class="title" fill="url(#primaryGrad)">
      Data Lake & FHIR Storage
    </text>

    <!-- Subtitle -->
    <text x="0" y="265" class="subtitle">
      Enterprise Platforms, Open-Source FHIR R4/R5 Stores & Clinical Data Lakes
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 305)">
      <rect x="0" y="0" width="120" height="28" rx="14" fill="#1e293b" stroke="#334155" />
      <text x="14" y="18" font-family="sans-serif" font-size="12" fill="#cbd5e1" font-weight="600">🏥 FHIR R4/R5</text>

      <rect x="130" y="0" width="140" height="28" rx="14" fill="#1e293b" stroke="#334155" />
      <text x="144" y="18" font-family="sans-serif" font-size="12" fill="#cbd5e1" font-weight="600">🔒 PHI Anonymizer</text>

      <rect x="280" y="0" width="130" height="28" rx="14" fill="#1e293b" stroke="#334155" />
      <text x="294" y="18" font-family="sans-serif" font-size="12" fill="#cbd5e1" font-weight="600">⚡ Clinical NLP</text>
    </g>
  </g>
</svg>
