<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="primaryGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="cyanGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".85"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".95"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="subtleGlow" width="120%" height="120%" x="-10%" y="-10%"><feGaussianBlur result="blur" stdDeviation="3"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>@keyframes pulseGlow{0%{opacity:.3;transform:scale(1)}50%{opacity:.6;transform:scale(1.05)}}@keyframes floatParticle{0%{transform:translateY(0)}50%{transform:translateY(-10px)}}.badge-text,.card-sub,.card-title,.subtitle,.title{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:800;font-size:46px;fill:#fff}.subtitle{font-weight:500;font-size:20px;fill:#94a3b8}.badge-text{font-weight:600;font-size:13px;fill:#38bdf8}.card-title{font-weight:700;font-size:15px;fill:#f8fafc}.card-sub{font-weight:400;font-size:12px;fill:#94a3b8}.pulse-bg{animation:pulseGlow 6s ease-in-out infinite;transform-origin:center}.float-1{animation:floatParticle 4s ease-in-out infinite}.float-2{animation:floatParticle 5s ease-in-out infinite 1s}.float-3{animation:floatParticle 4.5s ease-in-out infinite .5s}</style><rect width="1200" height="400" fill="url(#bgGrad)" rx="16"/><circle cx="200" cy="100" r="180" fill="#6366f1" class="pulse-bg" filter="url(#glow)" opacity=".25"/><circle cx="1000" cy="300" r="220" fill="#a855f7" class="pulse-bg" filter="url(#glow)" opacity=".2"/><g opacity=".05"><path stroke="#fff" stroke-width="1" d="M 0,50 H 1200 M 0,100 H 1200 M 0,150 H 1200 M 0,200 H 1200 M 0,250 H 1200 M 0,300 H 1200 M 0,350 H 1200"/><path stroke="#fff" stroke-width="1" d="M 100,0 V 400 M 200,0 V 400 M 300,0 V 400 M 400,0 V 400 M 500,0 V 400 M 600,0 V 400 M 700,0 V 400 M 800,0 V 400 M 900,0 V 400 M 1000,0 V 400 M 1100,0 V 400"/></g><g><path stroke="#475569" stroke-dasharray="4 4" stroke-width="2" d="M 80,80 L 220,50 M 80,180 L 220,120 M 80,180 L 220,240 M 220,120 L 340,180" transform="translate(720, 60)"/><path stroke="url(#cyanGrad)" stroke-width="2" d="M 80,80 L 220,120" filter="url(#subtleGlow)" transform="translate(720, 60)"/><g class="float-1" transform="translate(720, 60) translate(20, 50)"><rect width="120" height="60" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#subtleGlow)" rx="10"/><text x="15" y="26" class="card-title">EHR / HL7v2</text><text x="15" y="44" class="card-sub">Clinical Feed</text></g><g class="float-2" transform="translate(720, 60) translate(20, 150)"><rect width="120" height="60" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.5" rx="10"/><text x="15" y="26" class="card-title">DICOM Imaging</text><text x="15" y="44" class="card-sub">PACS / PACS-Web</text></g><g class="float-3" transform="translate(720, 60) translate(170, 90)"><rect width="140" height="80" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="2" filter="url(#glow)" rx="12"/><text x="15" y="30" fill="#a855f7" class="card-title">FHIR R4/R5</text><text x="15" y="50" class="card-sub">HAPI / Medplum</text><text x="15" y="66" class="badge-text" font-size="10">De-identified PHI</text></g><g class="float-1" transform="translate(720, 60) translate(320, 140)"><rect width="130" height="70" fill="url(#cardGrad)" stroke="#f472b6" stroke-width="1.5" rx="10"/><text x="15" y="28" class="card-title">Data Lake</text><text x="15" y="46" class="card-sub">AWS / GCP / Delta</text><text x="15" y="60" fill="#f472b6" class="badge-text" font-size="10">Analytics &amp; AI</text></g></g><g><g transform="translate(60, 0) translate(0, 75)"><rect width="270" height="32" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" rx="16"/><circle cx="16" cy="16" r="5" fill="#22c55e"/><text x="30" y="21" class="badge-text">HEALTHCARE DATA INFRASTRUCTURE</text></g><text x="0" y="165" class="title" transform="translate(60, 0)">Awesome Healthcare</text><text x="0" y="220" fill="url(#primaryGrad)" class="title" transform="translate(60, 0)">Data Lake &amp; FHIR Storage</text><text x="0" y="265" class="subtitle" transform="translate(60, 0)">Enterprise Platforms, Open-Source FHIR R4/R5 Stores &amp; Clinical Data Lakes</text><g><g transform="translate(60, 0) translate(0, 305) translate(0, 0)"><rect width="130" height="28" fill="#1e293b" stroke="#334155" rx="14"/><text x="14" y="18" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">FHIR R4/R5</text></g><g transform="translate(60, 0) translate(0, 305) translate(140, 0)"><rect width="140" height="28" fill="#1e293b" stroke="#334155" rx="14"/><text x="14" y="18" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">PHI Anonymizer</text></g><g transform="translate(60, 0) translate(0, 305) translate(290, 0)"><rect width="130" height="28" fill="#1e293b" stroke="#334155" rx="14"/><text x="14" y="18" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Clinical NLP</text></g></g></g></svg>